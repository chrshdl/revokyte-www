name: Deploy to GitHub Pages

# This repo holds built output only. It is rewritten wholesale by the
# publish workflow in the private source repo, which is also where this
# file comes from: editing it here is pointless, the next deploy overwrites
# it. Pages is configured for workflow builds, so nothing here is ever run
# through Jekyll.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stage the site on its own
        # Serve exactly what Astro built. This file and the README live in
        # the repo for humans, not for visitors.
        run: |
          mkdir -p _site
          rsync -a --exclude .git --exclude .github --exclude README.md \
                --exclude _site ./ _site/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
